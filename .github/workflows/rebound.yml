name: Rebound Screener (on demand)

on:
  workflow_dispatch:
    inputs:
      phone_number:
        description: "Telegram chat ID to reply to"
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Hide recipient ID in logs
        run: echo "::add-mask::$(jq -r '.inputs.phone_number // empty' "$GITHUB_EVENT_PATH")"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python rebound_screener.py
        env:
          SCREENER_WORKER_URL: ${{ secrets.SCREENER_WORKER_URL }}
          SCREENER_SECRET: ${{ secrets.SCREENER_SECRET }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PHONE_NUMBER: ${{ github.event.inputs.phone_number }}
