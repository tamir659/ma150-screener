name: Fibonacci Screener (on demand)

on:
  workflow_dispatch:
    inputs:
      phone_number:
        description: "Telegram chat ID to reply to"
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fibonacci_screener.py
        env:
          SCREENER_WORKER_URL: ${{ secrets.SCREENER_WORKER_URL }}
          SCREENER_SECRET: ${{ secrets.SCREENER_SECRET }}
          PHONE_NUMBER: ${{ github.event.inputs.phone_number }}
