name: MA150 Screener (on demand)

on:
  workflow_dispatch:
    inputs:
      phone_number:
        description: "WhatsApp number to reply to (E.164, no +, e.g. 972501234567)"
        required: true
        type: string
      period:
        description: "Moving-average window in days (150 or 20)"
        required: false
        type: string
        default: "150"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python screener.py
        env:
          SCREENER_WORKER_URL: ${{ secrets.SCREENER_WORKER_URL }}
          SCREENER_SECRET: ${{ secrets.SCREENER_SECRET }}
          PHONE_NUMBER: ${{ github.event.inputs.phone_number }}
          SMA_PERIOD: ${{ github.event.inputs.period }}
